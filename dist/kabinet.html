<style>
/* ART HOUSE — KABINET: eski lyuks dizayn (Emerald & Champagne Gold) to'liq tiklangan + yangi bo'limlar */
:root{--ease:cubic-bezier(.22,1,.36,1);--line-2:rgba(212,175,55,.42);--ink:#F8F5EE;--ok:#7fd3a4;--danger:#e8897a;--shadow:0 30px 80px -30px rgba(0,0,0,.7);--gold-hi:#F6E7B8;--gold-grad:linear-gradient(115deg,#b8913f 0%,#f6e7b8 28%,#d8bc7e 50%,#a67c2e 72%,#f3dfa6 100%);--f-display:'Cormorant Garamond',serif;--f-logo:'Cinzel','Cormorant Garamond',serif}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

:root{--bg:#061F18;--bg2:#0A2E23;--bg3:#0D3B2E;--gold:#D4AF37;--gold2:#E5C158;--iv:#F8F5EE;--mut:#AEBDB4;--line:rgba(212,175,55,.28);--glass:rgba(10,46,35,.92);--f:'Plus Jakarta Sans','Manrope','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--pad:clamp(20px,calc(5*var(--vw,1vw)),72px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--iv);font-family:var(--f);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--pad)}
section{padding:clamp(72px,calc(10*var(--vw,1vw)),130px) 0}
h2{font-size:clamp(30px,calc(5*var(--vw,1vw)),52px);font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--gold)}
.lead{color:var(--mut);max-width:560px;margin-top:16px;font-weight:300}
@keyframes en-wipe{from{clip-path:inset(0 100% 0 0);transform:translateX(-14px)}to{clip-path:inset(0);transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes lift{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 22px rgba(212,175,55,.2)}50%{box-shadow:0 0 46px rgba(212,175,55,.42)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes track{from{letter-spacing:-.05em;opacity:0}to{letter-spacing:.34em;opacity:1}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-170px);opacity:0}}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sheen{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes zoomv{from{transform:scale(1.06)}to{transform:scale(1.0)}}
/* intro */
#intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;pointer-events:all}
#intro .h{position:absolute;left:0;right:0;height:50.5%;background:radial-gradient(80% 120% at 50% 100%,#0D3B2E,#061F18);transition:transform 1.3s cubic-bezier(.77,0,.18,1)}
#intro .t{top:0}#intro .b{bottom:0;background:radial-gradient(80% 120% at 50% 0,#0D3B2E,#061F18)}
#intro.open .t{transform:translateY(-101%)}#intro.open .b{transform:translateY(101%)}
#intro .c{position:relative;text-align:center;z-index:2;transition:opacity .5s,transform 1s}
#intro.open .c{opacity:0;transform:scale(1.3)}
#skip{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:3;background:none;border:1px solid var(--line);color:var(--mut);padding:9px 18px;border-radius:100px;font-size:13px;animation:fade-in .6s 1s both}
#prog{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0;transform:scaleX(0);background:linear-gradient(90deg,var(--gold),#fff3c4);z-index:60;box-shadow:0 0 12px var(--gold)}
nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:calc(14px + env(safe-area-inset-top,0px)) var(--pad) 14px;display:flex;justify-content:space-between;align-items:center;background:rgba(6,31,24,.6);border-bottom:1px solid rgba(212,175,55,.12)}
.logo{font-weight:800;letter-spacing:.16em;font-size:15px;color:var(--gold)}
nav .l{display:flex;gap:26px;font-size:14px;color:var(--mut);align-items:center}nav .l a:hover{color:var(--gold)}
@media all{nav .l>a:not(.btn){display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:16px 30px;border-radius:14px;font-size:15px;font-weight:600;border:1px solid transparent;transition:transform .3s,box-shadow .3s,background .3s,color .3s,border-color .3s;text-align:center;line-height:1.3}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#061F18;box-shadow:0 8px 30px rgba(212,175,55,.22)}
.btn.gold:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(212,175,55,.4)}
.btn.ghost{border-color:var(--line);color:var(--iv);background:var(--glass);}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-3px)}
.btn.sm{padding:11px 18px;font-size:13px;border-radius:12px}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:110px 0 70px;overflow:hidden;isolation:isolate;background:radial-gradient(60% 50% at 80% 30%,rgba(212,175,55,.16),transparent 70%),linear-gradient(180deg,#061F18,#0A2E23 70%,#061F18)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .8fr;gap:clamp(24px,calc(5*var(--vw,1vw)),72px);align-items:center;width:100%}
.stars{position:absolute;inset:0;z-index:-1;pointer-events:none}
.stars i{position:absolute;bottom:0;width:2px;height:2px;background:var(--gold2);border-radius:50%;animation:rise linear infinite}
.badge{display:inline-flex;gap:10px;align-items:center;padding:8px 16px;border:1px solid var(--line);border-radius:100px;background:var(--glass);font-size:13px;color:var(--gold2)}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
h1{font-size:clamp(40px,calc(7.6*var(--vw,1vw)),90px);line-height:1.02;font-weight:800;letter-spacing:-.03em;margin:24px 0}
h1 span{display:block;color:var(--gold)}
h1 span+span{background:linear-gradient(100deg,var(--gold) 20%,#fff3c4 45%,var(--gold) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:clamp(16px,calc(2*var(--vw,1vw)),19px);color:var(--mut);max-width:540px;font-weight:300}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.facts{display:flex;gap:clamp(20px,calc(5*var(--vw,1vw)),52px);flex-wrap:wrap;margin-top:44px;padding-top:26px;border-top:1px solid var(--line)}
.facts b{display:block;font-size:28px;font-weight:700;color:var(--gold)}.facts span{font-size:13px;color:var(--mut)}
calc(.*var(--vw,1vw)){position:relative;justify-self:center;width:min(100%,400px);aspect-ratio:478/854;border-radius:32px;overflow:hidden;border:1px solid var(--gold);box-shadow:0 0 0 6px rgba(212,175,55,.08),0 40px 90px rgba(0,0,0,.6),0 0 80px rgba(212,175,55,.22)}
calc(.*var(--vw,1vw)) video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#061F18}
calc(.*var(--vw,1vw)) .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 20px;background:linear-gradient(0deg,rgba(6,31,24,.92),transparent);font-size:13px;color:var(--gold2)}
calc(.*var(--vw,1vw)) .fg{z-index:1}
calc(.*var(--vw,1vw)) .cap{z-index:2}
body:not(.go) .a{animation-play-state:paused!important}
.a1{animation:lift .9s .1s both}.a2{animation:en-wipe 1.3s .3s cubic-bezier(.7,0,.2,1) both}.a3{animation:en-wipe 1.3s .65s cubic-bezier(.7,0,.2,1) both,sheen 6s 2.2s linear infinite}.a4{animation:lift 1s 1.2s both}.a5{animation:lift 1s 1.45s both}.a6{animation:fade-in 1.2s 1.8s both}.a7{animation:pop 1.4s .4s both cubic-bezier(.2,.8,.2,1)}
@media all{
 .hero{align-items:flex-end;padding-bottom:40px}.hero .wrap{grid-template-columns:1fr}
 calc(.*var(--vw,1vw)){position:absolute;inset:0;width:100%;aspect-ratio:auto;border-radius:0;border:0;box-shadow:none;z-index:-2;animation:none}
 calc(.*var(--vw,1vw)) video.fg{object-fit:cover}calc(.*var(--vw,1vw)) .cap{display:none}
 .hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,31,24,.35) 0%,rgba(6,31,24,.55) 35%,rgba(6,31,24,.97) 82%)}}
.mq{overflow:hidden;border-block:1px solid var(--line);background:var(--bg2);padding:20px 0}
.mq div{display:flex;gap:56px;width:max-content;animation:marq 32s linear infinite}
.mq span{font-size:15px;color:var(--gold2);white-space:nowrap;display:flex;align-items:center;gap:56px}
.mq span:after{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
/* story */
#story{padding:0;height:calc(6 * 80vh + 100vh);position:relative;background:var(--bg)}
.stg{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
.sl{position:absolute;inset:0;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s;overflow:hidden;padding:120px 10px 150px;background:radial-gradient(70% 60% at 50% 40%,#0D3B2E,#061F18)}
.sl.on{opacity:1;visibility:visible}
.sl img:not(.bg){position:relative;max-width:min(calc(96*var(--vw,1vw)),1240px);max-height:calc(100svh - 270px);object-fit:contain;width:auto;height:auto;border-radius:22px;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 70px rgba(212,175,55,.16)}
.scap{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:90px var(--pad) calc(34px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(6,31,24,.96) 30%,transparent);text-align:center}
.cp{display:none}.cp.on{display:block;animation:lift .8s both}
.cp h3{font-size:clamp(22px,calc(4*var(--vw,1vw)),36px);color:var(--gold);font-weight:700}.cp p{color:var(--mut);margin-top:6px;font-weight:300}
.dots{display:flex;gap:8px;justify-content:center;margin-top:18px}
.dots i{width:26px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);transition:.5s}.dots i.on{background:var(--gold);width:44px;box-shadow:0 0 12px var(--gold)}
.sh{position:absolute;top:78px;left:0;right:0;z-index:5;text-align:center;padding:0 var(--pad)}
.sh h2{font-size:clamp(24px,calc(4*var(--vw,1vw)),40px)}
/* plans */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s,transform .9s}.rv.on{opacity:1;transform:none}
#plans{background:var(--bg2)}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:34px 0 28px}
.tab{padding:13px 24px;border-radius:100px;border:1px solid var(--line);background:var(--glass);color:var(--iv);font-size:15px;font-weight:600;transition:.3s}
.tab[aria-selected=true]{background:var(--gold);color:#061F18;border-color:var(--gold);box-shadow:0 0 26px rgba(212,175,55,.4)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:24px;align-items:start}
.plan{margin:0;border-radius:24px;overflow:hidden;background:var(--bg);border:1px solid var(--line);transition:transform .45s,box-shadow .4s,border-color .4s}
.plan:hover{transform:translateY(-8px);border-color:var(--gold);box-shadow:0 24px 60px rgba(212,175,55,.16)}
.plan[hidden]{display:none}.plan.pop{animation:pop .7s both}
.plan img{display:block;width:100%;height:auto;cursor:zoom-in}
.plan figcaption{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.plan b{display:block;font-size:16px;color:var(--gold)}.plan span{font-size:13px;color:var(--mut)}
/* calc */
.calc{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;margin-top:50px}
@media all{.calc{grid-template-columns:1fr}}
.card{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,calc(4*var(--vw,1vw)),44px);position:relative}
.field{margin-bottom:32px}.frow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.frow label{font-size:15px;color:var(--mut)}.frow output{font-size:28px;font-weight:700;color:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--gold) var(--p,0%),rgba(255,255,255,.12) var(--p,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--bg);border:3px solid var(--gold);box-shadow:0 0 18px rgba(212,175,55,.6)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--bg);border:3px solid var(--gold)}
.rng{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:10px}
.num{display:flex;align-items:center;gap:8px;margin-top:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:0 16px;max-width:220px}
.num span{color:var(--gold);font-weight:600}.num input{background:none;border:0;color:var(--iv);font:600 16px var(--f);padding:12px 0;width:100%;outline:0}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mo{padding:15px 4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--iv);font-size:14px;font-weight:600;transition:.3s}
.mo[aria-pressed=true]{background:var(--gold);color:#061F18;box-shadow:0 0 24px rgba(212,175,55,.4)}
.res{display:flex;flex-direction:column}
.res:before{content:"";position:absolute;inset:-1px;border-radius:28px;padding:1px;background:conic-gradient(from 0deg,transparent 60%,var(--gold) 80%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.donut{width:120px;height:120px;border-radius:50%;margin:0 auto 18px;background:conic-gradient(var(--gold) var(--a,30%),rgba(255,255,255,.12) 0);display:grid;place-items:center;transition:background .5s}
.donut:after{content:attr(data-t);width:88px;height:88px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-weight:700;color:var(--gold);font-size:20px}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
.row span{color:var(--mut)}.row b{font-weight:600;text-align:right}.row small{display:block;color:var(--mut);font-weight:400;font-size:12px}.zero{color:var(--gold2)}
.monthly{margin:20px 0;padding:22px;border-radius:20px;background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(212,175,55,.04));border:1px solid var(--line)}
.monthly span{font-size:14px;color:var(--mut)}.monthly b{display:block;font-size:clamp(34px,calc(5*var(--vw,1vw)),46px);font-weight:800;color:var(--gold);line-height:1.15}.monthly em{font-style:normal;font-size:16px;font-weight:500;color:var(--mut)}
.sch{background:none;border:1px dashed var(--line);color:var(--gold2);border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px}
.sched{max-height:0;overflow:auto;transition:max-height .6s;font-size:14px}.sched.open{max-height:220px;margin-bottom:16px}
.sr{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.07)}.sr span{color:var(--mut)}
.res .btn{width:100%;margin-top:auto}.note{font-size:12px;color:var(--mut);margin-top:14px;text-align:center}
/* amenities */
#adv{background:var(--bg2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:50px}
@media all{.grid{grid-template-columns:repeat(2,1fr)}}@media all{.grid{grid-template-columns:1fr}}
.am{position:relative;overflow:hidden;padding:32px 26px;border-radius:26px;background:var(--bg);border:1px solid var(--line);transition:transform .45s,border-color .4s,box-shadow .4s;min-height:250px}
.am:before{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--mx,50%) var(--my,0),rgba(212,175,55,.24),transparent 60%);opacity:0;transition:opacity .4s}
.am:hover{transform:translateY(-8px);border-color:var(--gold);box-shadow:0 24px 60px rgba(212,175,55,.16)}.am:hover:before{opacity:1}.am>*{position:relative}
.ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(212,175,55,.08);margin-bottom:24px;color:var(--gold);transition:.4s}
.am:hover .ico{background:var(--gold);color:#061F18}.ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.am h3{font-size:18px;color:var(--gold);margin-bottom:10px;line-height:1.3}.am p{font-size:14px;color:var(--mut);font-weight:300}
/* manager */
.mgr{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center}
@media all{.mgr{grid-template-columns:1fr}}
.av{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--gold);background:var(--bg3);color:var(--gold);font-size:30px;font-weight:800;box-shadow:0 0 30px rgba(212,175,55,.3)}
.mgr h3{font-size:22px;color:var(--gold)}.mgr p{color:var(--mut);font-weight:300;margin-top:4px}
.ct{display:flex;gap:10px;flex-wrap:wrap}
/* modal, lb */
.ov{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:rgba(4,12,9,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ov.open{display:grid;animation:fade-in .3s both}
.modal{width:100%;max-width:480px;max-height:92svh;overflow:auto;background:var(--bg2);border:1px solid var(--gold);border-radius:28px;padding:clamp(24px,calc(5*var(--vw,1vw)),40px);box-shadow:0 0 70px rgba(212,175,55,.22);animation:lift .5s both;position:relative}
.x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);border:0;color:var(--iv);font-size:20px;z-index:2}.x:hover{background:var(--gold);color:#061F18}
.modal h3{font-size:24px;color:var(--gold);margin-bottom:6px;padding-right:36px}.modal>div>p{color:var(--mut);font-size:14px;margin-bottom:20px}
.prev{padding:16px 20px;border-radius:18px;background:rgba(212,175,55,.09);border:1px solid var(--line);margin-bottom:20px}
.prev span{font-size:13px;color:var(--mut)}.prev b{display:block;font-size:28px;font-weight:800;color:var(--gold);line-height:1.2}.prev small{color:var(--mut);font-size:12px}
.fg{margin-bottom:16px}.fg label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
.fg input,.fg select{width:100%;padding:15px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--iv);font:500 16px var(--f);outline:0}

/* ===== lyuks splash, qo'ng'iroq oynasi, toast ===== */
/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; background: rgba(2, 8, 6, .78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fade .3s ease; }
.modal-box { width: min(520px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: linear-gradient(170deg, #0d2c22, #061510); border: 1px solid var(--line-2); border-radius: 24px; padding: 32px 28px 28px; position: relative; box-shadow: var(--shadow); animation: rise .45s var(--ease); }
.modal-box h3 { padding-right: 40px; margin-bottom: 8px; }
.modal-x { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); color: var(--ink); z-index: 3; background: rgba(4, 17, 13, .6); transition: .25s; }
.modal-x:hover { border-color: var(--gold); color: var(--gold); transform: rotate(90deg); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 140%); z-index: 120; max-width: min(92vw, 460px); padding: 14px 20px; border-radius: 14px; background: #0f2f25; border: 1px solid var(--line-2); color: var(--ink); font-size: 14px; box-shadow: var(--shadow); transition: transform .45s var(--ease), visibility .45s; text-align: center; visibility: hidden; }
.toast.show { transform: translate(-50%, 0); visibility: visible; }

/* ---------- yulduzchalar ---------- */
.stars { display: inline-flex; gap: 2px; color: var(--gold); }
.stars .ic { width: 15px; height: 15px; }
.stars .on { fill: var(--gold); }
.stars .off { opacity: .35; }
/* =====================================================================
   LYUKS LOGOTIP ANIMATSIYASI (splash)
   ===================================================================== */
.splash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 45%, #0e3527 0%, #04110d 62%, #020806 100%); transition: opacity .8s var(--ease), visibility .8s; }
.splash.done { opacity: 0; visibility: hidden; }
.splash-glow { position: absolute; width: 60vmin; height: 60vmin; border-radius: 50%; background: radial-gradient(circle, rgba(216, 188, 126, .22), transparent 65%); filter: blur(20px); animation: glow 3.2s ease-in-out infinite alternate; }
@keyframes glow { from { transform: scale(.85); opacity: .6; } to { transform: scale(1.1); opacity: 1; } }
.lux-logo { position: relative; display: grid; justify-items: center; gap: 18px; text-align: center; }
.lux-mark { width: clamp(84px, 16vmin, 128px); height: auto; fill: none; stroke: url(#gGold); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 14px rgba(216, 188, 126, .45)); }
.lux-mark use { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 2s var(--ease) .15s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.lux-word { position: relative; overflow: hidden; padding: 4px 6px; }
.lux-word span { display: block; font-family: var(--f-logo); font-weight: 600; font-size: clamp(30px, 6.4vmin, 56px); letter-spacing: .34em; margin-right: -.34em; white-space: nowrap;
  background: linear-gradient(100deg, #8a6a2a 0%, #d8bc7e 20%, #fff7dc 32%, #d8bc7e 44%, #a67c2e 60%, #f6e7b8 78%, #b8913f 100%); background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; opacity: 0; transform: translateY(30px); filter: blur(6px);
  animation: wordIn 1.1s var(--ease) .7s forwards, goldSweep 2.6s linear 1.2s infinite; }
@keyframes wordIn { to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes goldSweep { from { background-position: 120% 0; } to { background-position: -130% 0; } }
.lux-word::after { content: ''; position: absolute; inset: -20% auto -20% -40%; width: 30%; background: linear-gradient(100deg, transparent, rgba(255, 248, 220, .75), transparent); transform: skewX(-20deg); animation: flare 1.4s ease-in-out 1.6s 2; opacity: 0; }
@keyframes flare { 0% { left: -40%; opacity: 0; } 20% { opacity: 1; } 100% { left: 130%; opacity: 0; } }
.lux-line { width: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: line 1.2s var(--ease) 1.3s forwards; }
@keyframes line { to { width: min(320px, 60vw); } }
.lux-sub { font-size: 11px; letter-spacing: .5em; margin-right: -.5em; text-transform: uppercase; color: var(--gold); opacity: 0; animation: fadeUp .9s var(--ease) 1.7s forwards; white-space: nowrap; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: .9; transform: none; } }
.spark { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff3c9; box-shadow: 0 0 8px 2px rgba(246, 231, 184, .8); opacity: 0; animation: spark 2.6s ease-in-out infinite; }
@keyframes spark { 0% { opacity: 0; transform: translateY(0) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-60px) scale(1.1); } }

/* =====================================================================
   QO'NG'IROQ OYNASI — matnlar har doim gorizontal, bir qatorda
   (eski xato: tor flex elementlar ichida harflar ustun bo'lib tushardi)
   ===================================================================== */
.call-modal { padding: 0; }
.call-box { width: min(980px, 100%); height: min(720px, 100dvh); display: flex; flex-direction: column; background: #051510; border: 1px solid var(--line-2); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); animation: rise .45s var(--ease); }
@media (max-width: 720px) { .call-box { height: 100dvh; border-radius: 0; border: 0; } }
.call-box, .call-box * { writing-mode: horizontal-tb; text-orientation: mixed; }
.call-head { display: flex; align-items: center; gap: 14px; padding: 14px 70px 14px 18px; border-bottom: 1px solid var(--line); position: relative; min-height: 70px; }
.call-head .modal-x { top: 50%; transform: translateY(-50%); }
.call-head .modal-x:hover { transform: translateY(-50%) rotate(90deg); }
.call-who { display: flex; align-items: center; gap: 12px; flex: 1 1 auto; min-width: 0; }
.call-meta { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.call-meta b, .call-meta span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; word-break: normal; overflow-wrap: normal; }
.call-meta b { font-size: 15px; }
.call-status { font-size: 12.5px; color: var(--mut); }
.call-status.ok { color: var(--ok); }
.call-avatar { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-logo); font-size: 14px; letter-spacing: .08em; color: #1b1406; background: var(--gold-grad); }
.call-avatar.lg { width: 88px; height: 88px; font-size: 26px; }
.call-timer { flex: none; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--gold); white-space: nowrap; }
.call-step { flex: 1 1 auto; min-height: 0; overflow: auto; }
#callIntro { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; padding: 22px; }
@media (max-width: 760px) { #callIntro { grid-template-columns: minmax(0, 1fr); } }
.call-pre { position: relative; border-radius: 18px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #0f3326, #030c09); aspect-ratio: 4 / 3; border: 1px solid var(--line); min-width: 0; }
.call-pre video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.call-pre-ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; color: var(--mut); font-size: 14px; text-align: center; }
.call-pre-ph span { max-width: 28ch; }

<script>
/* =====================================================================
   ART HOUSE — MA'LUMOTLAR QATLAMI (sayt ↔ kabinet)
   • Server bo'lmasa: localStorage + BroadcastChannel — sayt va kabinet bitta
     brauzerda ochiq bo'lsa, o'zgarishlar darhol (sahifani yangilamasdan) ko'rinadi.
   • CFG.API_URL berilsa: server/server.js REST + SSE orqali barcha qurilmalar
     o'rtasida jonli sinxronlash.
   ===================================================================== */
(function () {
  'use strict';
  var API = (window.CFG && CFG.API_URL || '').replace(/\/$/, '');
  if (API === 'auto') API = location.protocol.indexOf('http') === 0 ? location.origin : ''; // sayt server/server.js orqali ochilganda
  var KINDS = ['reviews', 'leads', 'calls'];
  var PREFIX = 'ah3_';
  var bc = 'BroadcastChannel' in window ? new BroadcastChannel('arthouse') : null;
  var listeners = {};
  var cache = {};
  var token = null;
  try { var _ks = JSON.parse(sessionStorage.getItem('ah_s')); if (_ks && _ks.t) token = _ks.t; } catch (e) {} // kabinet sessiyasi

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function readLS(k, d) { try { var v = JSON.parse(localStorage.getItem(PREFIX + k)); return v == null ? d : v; } catch (e) { return d; } }
  function writeLS(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) {} }

  function emit(kind, info) {
    (listeners[kind] || []).forEach(function (cb) { try { cb(cache[kind] || [], info || {}); } catch (e) { console.error(e); } });
    (listeners['*'] || []).forEach(function (cb) { try { cb(kind, info || {}); } catch (e) { console.error(e); } });
  }
  function broadcast(kind, info) { if (bc) bc.postMessage({ t: 'change', kind: kind, info: info || {} }); }

  function headers(json) {
    var h = {};
    if (json) h['Content-Type'] = 'application/json';
    if (token) h.Authorization = 'Bearer ' + token;
    return h;
  }
  function req(method, path, body) {
    return fetch(API + path, { method: method, headers: headers(body !== undefined), body: body !== undefined ? JSON.stringify(body) : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.status === 204 ? null : r.json(); });
  }

  /* ---------- asosiy CRUD ---------- */
  function load(kind) {
    if (!API) { cache[kind] = readLS(kind, []); return Promise.resolve(cache[kind]); }
    return req('GET', '/api/' + kind).then(function (rows) { cache[kind] = rows || []; return cache[kind]; })
      .catch(function () { cache[kind] = cache[kind] || []; return cache[kind]; });
  }
  function list(kind) { return cache[kind] || (cache[kind] = API ? [] : readLS(kind, [])); }

  function add(kind, obj) {
    obj = Object.assign({ id: uid(), at: Date.now() }, obj);
    if (!API) {
      var rows = readLS(kind, []); rows.unshift(obj); writeLS(kind, rows.slice(0, 500));
      cache[kind] = readLS(kind, []); emit(kind, { op: 'add', id: obj.id }); broadcast(kind, { op: 'add', id: obj.id });
      return Promise.resolve(obj);
    }
    return req('POST', '/api/' + kind, obj).then(function (saved) {
      var rows = list(kind).filter(function (x) { return x.id !== saved.id; }); rows.unshift(saved); cache[kind] = rows; emit(kind, { op: 'add', id: saved.id }); return saved;
    });
  }
  function update(kind, id, patch) {
    if (!API) {
      var rows = readLS(kind, []).map(function (x) { return x.id === id ? Object.assign({}, x, patch) : x; });
      writeLS(kind, rows); cache[kind] = rows; emit(kind, { op: 'update', id: id }); broadcast(kind, { op: 'update', id: id });
      return Promise.resolve();
    }
    return req('PATCH', '/api/' + kind + '/' + encodeURIComponent(id), patch).then(function () {
      cache[kind] = list(kind).map(function (x) { return x.id === id ? Object.assign({}, x, patch) : x; }); emit(kind, { op: 'update', id: id });
    });
  }
  function remove(kind, id) {
    if (!API) {
      writeLS(kind, readLS(kind, []).filter(function (x) { return x.id !== id; }));
      cache[kind] = readLS(kind, []); emit(kind, { op: 'remove', id: id }); broadcast(kind, { op: 'remove', id: id });
      return Promise.resolve();
    }
    return req('DELETE', '/api/' + kind + '/' + encodeURIComponent(id)).then(function () {
      cache[kind] = list(kind).filter(function (x) { return x.id !== id; }); emit(kind, { op: 'remove', id: id });
    });
  }
  function on(kind, cb) { (listeners[kind] = listeners[kind] || []).push(cb); }

  /* ---------- sozlamalar: kabinet → Sozlamalar ('ah_set': 1 m² narxi, minimal %, oylar, kurs) ---------- */
  function settings() { try { return JSON.parse(localStorage.getItem('ah_set')) || {}; } catch (e) { return {}; } }
  function applySettings(s) {
    s = s || settings();
    if (s.p) CFG.PRICE_M2 = +s.p;
    if (s.d != null) CFG.DOWN_MIN = +s.d;
    if (s.m && s.m.length) CFG.MONTHS = s.m.map(Number);
    if (s.usd) CFG.USD_UZS = +s.usd;
  }
  function setToken(t) { token = t || null; }

  /* ---------- video-sharhlar uchun fayllar (IndexedDB yoki server) ---------- */
  var dbp = null;
  function idb() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      if (!('indexedDB' in window)) return rej(new Error('no-idb'));
      var r = indexedDB.open('arthouse-media', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('blobs'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    return dbp;
  }
  function putBlob(blob) {
    if (API) {
      return fetch(API + '/api/media', { method: 'POST', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob })
        .then(function (r) { if (!r.ok) throw new Error('upload'); return r.json(); }).then(function (j) { return j.url; });
    }
    var key = 'idb:' + uid();
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('blobs', 'readwrite'); tx.objectStore('blobs').put(blob, key);
        tx.oncomplete = function () { res(key); }; tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  /* "idb:..." kalitini yoki oddiy URLni <video> uchun manzilga aylantiradi */
  function mediaURL(ref) {
    if (!ref) return Promise.resolve('');
    if (ref.indexOf('idb:') !== 0) return Promise.resolve(ref.charAt(0) === '/' ? API + ref : ref);
    return idb().then(function (db) {
      return new Promise(function (res) {
        var g = db.transaction('blobs').objectStore('blobs').get(ref);
        g.onsuccess = function () { res(g.result ? URL.createObjectURL(g.result) : ''); };
        g.onerror = function () { res(''); };
      });
    }).catch(function () { return ''; });
  }
  function dropBlob(ref) {
    if (!ref || ref.indexOf('idb:') !== 0) return;
    idb().then(function (db) { db.transaction('blobs', 'readwrite').objectStore('blobs').delete(ref); }).catch(function () {});
  }

  /* ---------- signal kanali (WebRTC qo'ng'iroqlar uchun) ---------- */

const SYS_PUB="Siz — \"ART HOUSE Luxury Residence\" (Toshkent) loyihasining xususiy sotuv konsultantisiz. Siz bot emas: o'zingizni eng tajribali, muloyim va mahoratli shaxsiy maslahatchi sifatida his qiling va shunday yozing.\n\nUSLUB\n- Mijoz bilan \"Siz\" deb, iliq, sokin va hurmatli tilda gaplashing. Qisqa, aniq jumlalar; ortiqcha reklama va katta harfli qichqiriqlar yo'q. Emoji ishlatmang.\n- Aslo yopishqoq bo'lmang, quruq buyruq bermang (\"telefon yozing!\" demang). Taklifni savol yoki yordam ko'rinishida bering.\n- Mijoz tilida (UZ/RU/EN) javob bering.\n\nMOLIYAVIY ANIQLIK\n- To'lov haqidagi har bir savolga darhol raqamlar bilan javob bering. Faqat sizga berilgan KONTEKSTdagi (xonadonlar, m², joriy 1 m² narxi, minimal boshlang'ich %, mavjud oylar) ma'lumotlardan foydalaning.\n- Hisob: narx = maydon × 1 m² narxi; boshlang'ich = narxning kamida minimal %; oylik = (narx − boshlang'ich) / oylar. Foiz 0%.\n- Aniq bilmagan narsani o'ylab topmang: \"Buni menejerimiz aniqlashtirib beradi\" deng. Chegirma, muddat yoki huquqiy kafolat va'da qilmang.\n\nHISSIY ZAKO VA YOPISH FORMULASI\n- Mijoz ikkilansa, xavotir bildirsa yoki jamg'armasi haqida gapirsa (masalan: 25 000$ yig'ganman, oilam haqida qayg'uraman, 2–3 xonali to'g'ri keladimi), quruq ro'yxat bermang. Avval samimiy tasdiqlang: jamg'armani yig'ish mehnat va intizom ekanini, oila xotirjamligi birinchi o'rinda ekanini ayting.\n- Keyin xavotirni moliyaviy mantiq bilan yumshating: ko'chmas mulk pulni inflyatsiyadan saqlaydi, qiymati o'sishi va ijaradan daromad keltirishi mumkin. Aniq foiz yoki kafolat va'da qilmang.\n- Keyin Art House afzalligini ko'rsating: qulay va go'zal hayot, 30% boshlang'ich to'lov, qolgani 0% bilan bo'lib.\n- Har javobni bitta jozibali taklif-savol bilan tugating: «Mablag'ingizga mos to'lov grafigini hoziroq hisoblab beraymi?»\n- Suhbatni o'zingiz boshlang: kutib o'tirmang, byudjet, xonalar soni va ko'chish muddatini tabiiy so'rang.\n- Ism, telefon, byudjet, xona turi va suhbat tarixi bazaga o'zi saqlanadi; mijozga buni qayta-qayta eslatmang.\n\nSUHBAT TAKTIKASI\n1. Avval tinglang: nechta xonali, byudjet (boshlang'ich to'lov), qachon ko'chib o'tmoqchi, oila hajmi.\n2. Mos 1–2 variantni tavsiya qiling, sababini ayting va oylik to'lovni hisoblab bering.\n3. E'tirozlarga (qimmat, o'ylab ko'raman, ishonch) hurmat bilan javob bering: foizsizlik, qat'iy narx, to'lov grafigi.\n4. Suhbat tabiiy ravishda isiganda, samimiy tarzda ismini so'rang, so'ng (\"Hisob-kitobni menejerimiz sizga yozma ko'rinishda yuborishi uchun\") telefon raqamini so'rang. Ikkisini ham bir xabarda so'ramang. Rad etsa — majburlamang.\n5. Ism va telefon olingach, minnatdorchilik bildiring va menejer aloqaga chiqishini ayting.\n\nMAQSAD: menejerga tayyor, \"pishgan\" mijozni topshirish — ismi, telefoni, qiziqqan xonadoni (m²), byudjeti, muddati va asosiy e'tirozi aniq bo'lsin.\n\nCHEGARALAR: siyosat, shaxsiy ma'lumotlarni noqonuniy so'rash, raqobatchilarni haqorat qilish, shu loyihadan tashqari mavzular — xushmuomalalik bilan rad eting va suhbatni xonadonga qaytaring. Siz AI ekanligingiz so'ralsa — yolg'on aytmang.",SYS_AGENT="Siz — \"ART HOUSE\" kabinetidagi UNIVERSAL AI AGENTsiz. Kabinetga kirgan direktorni doim o'zingiz birinchi bo'lib salomlab, bugungi savdo dinamikasi va tushumlar tahlilini taklif qilasiz (ijrochi yordamchi kabi, tashabbus bilan). Sizdan direktor va menejerlar foydalanadi. Siz bir vaqtning o'zida uch mutaxassis rolini bajarasiz va har javobda qaysi rolda gapirayotganingizni qisqa ko'rsatasiz.\n\nROL 1 — BUXGALTER / ANALITIK\n- Oylik tushum, to'langan va qoldiq summalar, oylik to'lovlar grafigi, keyingi 3–12 oy tushum prognozi, sotuv dinamikasi (kunlik/oylik), konversiya (ariza → bron → sotuv) va chegirmalar ta'sirini hisoblab bering.\n- Har bir raqamni manbasi va formulasi bilan yozing: \"Qoldiq = shartnoma summasi − boshlang'ich − (o'tgan oylar × oylik)\". Jadval va qisqa xulosa bering.\n- To'lov daftari (haqiqiy kirimlar) bo'lmasa, hisob-kitob to'lov GRAFIGIGA asoslangan taxminiy ekanini ochiq ayting.\n\nROL 2 — VAKOLATCHI / HUQUQSHUNOS\n- Shartnoma shartlari (predmet, narx, to'lov grafigi, topshirish muddati, kechikish uchun javobgarlik, bekor qilish va pulni qaytarish, ro'yxatdan o'tkazish, kafolatlar, nizolarni hal qilish), bo'lib to'lashdagi xatarlar (to'lov kechikishi, kurs/valyuta, qurilish muddati, ikki marta sotuv, mijoz chiqib ketishi) va mijoz bilan kelishuv xulosalarini tayyorlang.\n- Natijani tuzilgan ro'yxat sifatida bering: \"Shart — Xavf darajasi — Tavsiya\".\n- Qonun moddalarini va jarima foizlarini o'ylab topmang. Ishonchingiz komil bo'lmasa: \"Bu band amaldagi qonunchilik bo'yicha yurist tomonidan tekshirilishi shart\" deng. Har huquqiy javob oxirida: \"Dastlabki xulosa; imzolashdan oldin litsenziyali yurist tasdig'i zarur.\"\n\nROL 3 — TIZIM AGENTI (CRM)\n- Bazadan istalgan mijozni ism, telefon (turli yozilishda: \"77 384 50 24\", \"+998773845024\") yoki m² bo'yicha toping. Topilsa: ism, telefon, xonadon/m², narx, holat, boshlang'ich, oylik, to'langan/qoldiq, AI bilan suhbat xulosasi (byudjet, e'tirozlar) va keyingi tavsiya qadam.\n- So'ralsa, mijozga SMS matni tayyorlang: ≤ 300 belgi, \"Hurmatli {ism}\" bilan, aniq raqamlar va bitta harakatga chaqiruv. Matnni yuborishni faqat direktor/menejer tasdiqlagandan so'ng amalga oshirishni taklif qiling; o'zingiz \"yubordim\" demang.\n- Sotuv dinamikasi, kunlik yangi arizalar, kim bron qildi / kim sotib olmadi (sabab bilan) hisobotlarini bering.\n\nUMUMIY QOIDALAR\n- Faqat sizga berilgan KONTEKST (leads, chats, settings) ma'lumotlaridan foydalaning. Yo'q ma'lumotni to'qimang: \"Bazada topilmadi\" deng va nimani kiritish kerakligini ayting.\n- Mijozlarning shaxsiy ma'lumotlarini faqat kabinet foydalanuvchisiga ko'rsating; ularni tashqariga chiqarmang, ommaviy xabarlarga qo'shmang.\n- Menejer roli cheklangan: sozlamalarni o'zgartirish, o'chirish va moliyaviy hisobotning to'liq ko'rinishi faqat direktorga. Menejer so'rasa — muloyim rad eting.\n- Qaytarib bo'lmaydigan amallarni (o'chirish, SMS yuborish, narx o'zgartirish) bajarishdan oldin tasdiq so'rang.\n- Javob: qisqa xulosa birinchi, keyin jadval/ro'yxat, oxirida \"Keyingi qadam\" bitta jumlada. Til: o'zbekcha (so'ralsa ruscha/inglizcha).";

(function(){
try{if(localStorage.getItem('ah_rst')!=='3'){localStorage.removeItem('ah_lock');var u=JSON.parse(localStorage.getItem('ah_users')||'null');if(u){u.dir=null;localStorage.setItem('ah_users',JSON.stringify(u))}sessionStorage.removeItem('ah_s');localStorage.setItem('ah_rst','3')}}catch(e){}
var A=document.getElementById('adm');if(!A)return;
var L=[['uz',"O'zbekcha"],['cy','Ўзбекча'],['en','English'],['ru','Русский'],['fr','Français'],['it','Italiano'],['es','Español'],['de','Deutsch'],['tr','Türkçe']];
var AIN={uz:"O'zbek",cy:"O'zbek (kirill yozuvida)",en:'English',ru:'Russian',fr:'French',it:'Italian',es:'Spanish',de:'German',tr:'Turkish'};
var g=document.createElement('div');g.id='cg';g.innerHTML='<button type="button" aria-label="Language" aria-haspopup="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5c-2.3-2.4-3.4-5.2-3.4-8.5s1.1-6.1 3.4-8.5z"/></svg><b id="cgl">UZ</b></button><div id="cgm" hidden>'+L.map(function(x){return '<button type="button" data-l="'+x[0]+'"><i>'+x[0].toUpperCase()+'</i><span>'+x[1]+'</span></button>'}).join('')+'</div>';A.appendChild(g);
var m=g.querySelector('#cgm');g.firstChild.addEventListener('click',function(e){e.stopPropagation();m.hidden=!m.hidden});
document.addEventListener('click',function(e){if(!e.target.closest('#cg'))m.hidden=true});
m.addEventListener('click',function(e){var b=e.target.closest('[data-l]');if(!b)return;m.hidden=true;if(window.setLang)setLang(b.dataset.l,true);else{try{localStorage.setItem('ah_lang',b.dataset.l)}catch(x){}}run()});
var O=new WeakMap(),AT=['placeholder','title','aria-label'],busy=0;
function cur(){try{return typeof LANG!=='undefined'?LANG:'uz'}catch(e){return'uz'}}
function T(s,l){var t=s.trim();if(!t||l==='uz')return s;var q=t.match(/^Juda ko'p urinish\. (\d+) daqiqadan so'ng urinib ko'ring\.$/);if(q)return s.replace(t,function(){return AHT("Juda ko'p urinish. {n} daqiqadan so'ng urinib ko'ring.",{n:q[1]})});return AHTR(s,l)}
function node(n,l){var p=n.parentElement;if(!p||p.closest('#cg,script,style,svg,.nt9'))return;var r=O.get(n);if(!r||n.nodeValue!==r.t){r={o:n.nodeValue,t:n.nodeValue};O.set(n,r)}var v=T(r.o,l);if(v!==n.nodeValue)n.nodeValue=v;r.t=v}
function attrs(e,l){var o=O.get(e)||{};AT.forEach(function(a){if(!e.hasAttribute(a))return;var v=e.getAttribute(a);if(!o[a]||o[a].t!==v)o[a]={o:v,t:v};var t=T(o[a].o,l);if(t!==v)e.setAttribute(a,t);o[a].t=t});O.set(e,o)}
/* kabinet + body'ga qo'shiladigan dialoglar (o'chirish, ball, video-chat, qo'ng'iroq) */
function roots(){return [A].concat([].slice.call(document.querySelectorAll('body>.dlg,body>.vcm,#vcm,#inc,#ring,#kCall,#toast,#splash')))}
function OB(){mo.observe(A,C);['ring','kCall','toast'].forEach(function(id){var e=document.getElementById(id);if(e)mo.observe(e,C)})}
function walk(R,l){var w=document.createTreeWalker(R,NodeFilter.SHOW_TEXT),n;while(n=w.nextNode())node(n,l);if(R.matches&&R.matches('[placeholder],[title],[aria-label]')&&!R.closest('#cg'))attrs(R,l);R.querySelectorAll('[placeholder],[title],[aria-label]').forEach(function(e){if(!e.closest('#cg'))attrs(e,l)})}
function run(){if(busy)return;busy=1;var l=cur();roots().forEach(function(R){walk(R,l)});var b=document.getElementById('cgl');if(b)b.textContent=l.toUpperCase();m.querySelectorAll('[data-l]').forEach(function(x){x.setAttribute('aria-current',x.dataset.l===l)});busy=0}
var C={childList:true,subtree:true,characterData:true};
var mo=new MutationObserver(function(){mo.disconnect();bo.disconnect();run();OB();bo.observe(document.body,{childList:true})});OB();
var bo=new MutationObserver(function(ms){var hit=0;ms.forEach(function(x){x.addedNodes.forEach(function(n){if(n.nodeType===1&&n.matches('.dlg,.vcm,#vcm,#inc')){hit=1;mo.observe(n,C)}})});if(hit){mo.disconnect();bo.disconnect();run();OB();document.querySelectorAll('body>.dlg,body>.vcm').forEach(function(n){mo.observe(n,C)});bo.observe(document.body,{childList:true})}});bo.observe(document.body,{childList:true});
